# The tool is offline-only and every test uses practice (mock) models,
# so CI needs no keys and no Ollama install.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch SDK or dependency drift
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Dart 3.8.1 is the minimum supported version (pubspec: sdk ^3.8.1).
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.8.1
      - name: Show versions and locale environment
        shell: bash
        run: |
          dart --version
          echo "os=${{ matrix.os }} TZ=${TZ-} LANG=${LANG-} LC_ALL=${LC_ALL-} LC_MESSAGES=${LC_MESSAGES-} OLLAMA_CARRY_LANG=${OLLAMA_CARRY_LANG-}"
          grep -E '^(version|  sdk):' pubspec.yaml
          git log -1 --format='%H %s'
      - run: dart pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test
      - run: dart run bin/ollama_carry.dart tour
      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          dart --version
          git status --short
          git ls-files --eol | grep -v -E 'i/(lf|-text)' | head -20 || true
          dart format --output=none --set-exit-if-changed . | head -40 || true
          dart test -r expanded 2>&1 | tail -80 || true
